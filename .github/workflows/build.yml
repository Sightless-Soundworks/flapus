name: build

# Official builds of the flapus command line tool.
#
# Every push builds flapus.exe for x86 and x64 with a pinned w64devkit, runs the
# tests, and checks that both builds write the same Opus files. A push to main
# publishes both exes as the release "latest", a tag v* as a versioned release.
#
# The builds are reproducible: the same commit and devkit give the same exe, byte
# for byte, also on another machine (no timestamp, no paths, no compiler ident).
# Rebuild locally in the devkit shell with:
#
#   gcc -O2 -ffp-contract=off -msse2 -mfpmath=sse -DFLAPUS_PORTABLE_MATH \
#       -fno-ident -s -Wl,--no-insert-timestamp -o flapus.exe flapus_cli.c
#
# (x64: without -msse2 -mfpmath=sse) and compare with the SHA-256 that GitHub shows
# next to each release asset.
#
# The encoder is built with FLAPUS_PORTABLE_MATH, so the output is the same on
# every x86 CPU; see README.
#
# w64devkit is MinGW-w64 with the system msvcrt.dll, so the exes also run on older
# Windows versions; a check below keeps it that way.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  W64DEVKIT_VERSION: 2.11.0
  CFLAGS: -O2 -ffp-contract=off -DFLAPUS_PORTABLE_MATH -fno-ident -s -Wl,--no-insert-timestamp

jobs:
  build:
    runs-on: windows-latest
    # One output per arch; GitHub combines the outputs of the matrix jobs.
    outputs:
      opus-x86: ${{ steps.encode.outputs.opus-x86 }}
      opus-x64: ${{ steps.encode.outputs.opus-x64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            devkit_sha256: f7e8c79eacc4cbdd718a4cbb6519f2f370311017dc08f7750abedb4340d1b65d
            archflags: -msse2 -mfpmath=sse
          - arch: x64
            devkit_sha256: 54c2bb9962e8a30c8270e34c5efc3d5fee579f53087fa7d435b95fbba2af7b2b
            archflags: ""
    steps:
      - uses: actions/checkout@v7

      - name: Runner CPU
        shell: pwsh
        run: |
          Write-Host "CPU: $((Get-CimInstance Win32_Processor).Name)"

      - name: Get w64devkit ${{ matrix.arch }}
        shell: pwsh
        run: |
          $ver = $env:W64DEVKIT_VERSION
          $url = "https://github.com/skeeto/w64devkit/releases/download/v$ver/w64devkit-${{ matrix.arch }}-$ver.7z.exe"
          Write-Host "fetching $url"
          curl.exe -sSL -o "$env:RUNNER_TEMP\devkit.7z" $url
          $got = (Get-FileHash "$env:RUNNER_TEMP\devkit.7z" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne "${{ matrix.devkit_sha256 }}") { throw "sha256 mismatch: expected ${{ matrix.devkit_sha256 }}, got $got" }
          7z x -y -oC:\ "$env:RUNNER_TEMP\devkit.7z" | Out-Null
          & C:\w64devkit\bin\gcc.exe -dumpmachine

      # flapus.h is generated; a hand edit, or a src/ change without a new
      # amalgamation, must not reach a release.
      - name: flapus.h matches src/
        shell: pwsh
        run: |
          python tools/amalgamate.py
          git diff --exit-code -- flapus.h
          if ($LASTEXITCODE -ne 0) { throw "flapus.h is out of date: run python tools/amalgamate.py" }

      - name: Build flapus-${{ matrix.arch }}.exe
        shell: pwsh
        run: |
          $env:PATH = "C:\w64devkit\bin;$env:PATH"
          $flags = "$env:CFLAGS ${{ matrix.archflags }}".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          & gcc @flags -o flapus-${{ matrix.arch }}.exe flapus_cli.c
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          & .\flapus-${{ matrix.arch }}.exe --version

      # Older Windows versions start the exe only if it imports nothing beyond
      # KERNEL32.dll and msvcrt.dll, only KERNEL32 functions they have, and its
      # subsystem version is at most 5.x. A new KERNEL32 import must be checked
      # against the Windows versions it exists in before it is added to the list.
      - name: Windows compatibility
        shell: pwsh
        run: |
          $env:PATH = "C:\w64devkit\bin;$env:PATH"
          $allowed = @("CloseHandle", "CreateThread", "DeleteCriticalSection", "EnterCriticalSection",
            "GetCPInfo", "GetLastError", "GetModuleHandleA", "GetProcAddress", "GetSystemInfo",
            "InitializeCriticalSection", "LeaveCriticalSection", "MultiByteToWideChar",
            "SetUnhandledExceptionFilter", "Sleep", "TlsGetValue", "VirtualProtect", "VirtualQuery",
            "WaitForSingleObject", "WideCharToMultiByte")
          $pe = & objdump -p flapus-${{ matrix.arch }}.exe
          $dll = $null; $dlls = @(); $k32 = @()
          foreach ($line in $pe) {
            if ($line -match "DLL Name: (\S+)") { $dll = $Matches[1]; $dlls += $dll }
            elseif ($line -match "^\s*$") { $dll = $null }
            elseif ($dll -eq "KERNEL32.dll" -and $line -match "^\s+[0-9a-f]+\s+\d+\s+(\w+)") { $k32 += $Matches[1] }
          }
          $sub = [int]($pe | Select-String "MajorSubsystemVersion\s+(\d+)").Matches[0].Groups[1].Value
          Write-Host "DLLs: $($dlls -join ', '); subsystem version $sub.x; $($k32.Count) KERNEL32 functions"
          $bad = @($dlls | Where-Object { $_ -notin "KERNEL32.dll", "msvcrt.dll" })
          if ($bad) { throw "imports other DLLs: $($bad -join ', ')" }
          $bad = @($k32 | Where-Object { $_ -notin $allowed })
          if ($bad) { throw "new KERNEL32 imports: $($bad -join ', ')" }
          if ($sub -gt 5) { throw "subsystem version $sub.x is too new for older Windows versions" }

      - name: Tests
        shell: pwsh
        run: |
          $env:PATH = "C:\w64devkit\bin;$env:PATH"
          $arch = "${{ matrix.archflags }}".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          foreach ($t in "bitreader", "portable_math", "rcp_tables") {
            & gcc -O2 @arch -I. -o "t_$t.exe" "test/$t.c"
            if ($LASTEXITCODE -ne 0) { throw "${t}: build failed" }
            & ".\t_$t.exe"
            if ($LASTEXITCODE -ne 0) { throw "$t failed" }
          }
          & gcc -O2 -ffp-contract=off @arch -o t_api.exe test/api/main.c test/api/impl.c
          if ($LASTEXITCODE -ne 0) { throw "api: build failed" }
          & .\t_api.exe
          if ($LASTEXITCODE -ne 0) { throw "api test failed" }
          Write-Host "api: ok"

      # The same input must give the same Opus files from both builds - that is
      # what FLAPUS_PORTABLE_MATH guarantees, and the compare job checks it with one
      # digest of all Opus files per build. FLAC and WAV output still use libm's
      # sin/cos/log, so they are only checked for errors.
      - name: Encode the test signals
        id: encode
        shell: pwsh
        run: |
          python tools/testsignal.py signals
          function flapus { & ".\flapus-${{ matrix.arch }}.exe" -s @args; if ($LASTEXITCODE -ne 0) { throw "flapus $args failed" } }
          foreach ($s in "stereo44", "mono48") {
            flapus --serial 1 --padding 0 "signals\$s.wav" "signals\$s.opus"
            flapus --serial 1 --padding 0 --bitrate 24 "signals\$s.wav" "signals\$s-24k.opus"
            flapus "signals\$s.wav" "signals\$s.flac"
            flapus "signals\$s.opus" "signals\$s-dec.wav"
          }
          $lines = Get-ChildItem signals -Filter *.opus | Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Write-Host
          $all = [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($lines -join "`n"))
          Add-Content $env:GITHUB_OUTPUT "opus-${{ matrix.arch }}=$([Convert]::ToHexString($all).ToLower())"

      # A single file without archive: the artifact is the plain exe.
      - uses: actions/upload-artifact@v7
        with:
          path: flapus-${{ matrix.arch }}.exe
          archive: false
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: x86 and x64 write the same Opus files
        env:
          X86: ${{ needs.build.outputs.opus-x86 }}
          X64: ${{ needs.build.outputs.opus-x64 }}
        run: |
          echo "x86: $X86"
          echo "x64: $X64"
          test -n "$X86" && test "$X86" = "$X64" && echo "x86 and x64: identical Opus output"

  # main -> the release "latest" (a pre-release, rebuilt for every push), v* -> a
  # versioned release. GitHub shows the SHA-256 of every asset.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: compare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: flapus-*.exe
          merge-multiple: true
          path: rel
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd rel
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            title="flapus ${tag#v}"
            first="flapus ${tag#v}: Opus and FLAC encoder/decoder, command line tool."
            flags=()
          else
            # An older run that finishes late must not replace a newer build.
            head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            if [ "$head" != "$GITHUB_SHA" ]; then echo "main has moved on to $head; skipped"; exit 0; fi
            tag=latest
            title="flapus latest"
            first="Development build of ${GITHUB_SHA:0:7}, rebuilt for every push to main."
            flags=(--prerelease --latest=false --target "$GITHUB_SHA")
            gh release delete latest --cleanup-tag --yes 2>/dev/null || true
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" 2>/dev/null || true
          fi
          {
            echo "$first"
            echo
            echo "- \`flapus-x86.exe\`: 32-bit Windows, \`flapus-x64.exe\`: 64-bit Windows. Single files, no DLLs beyond Windows' own."
            echo "- Built with w64devkit $W64DEVKIT_VERSION and \`FLAPUS_PORTABLE_MATH\`: the Opus output is the same on every x86 CPU."
            echo "- Reproducible: the build flags are in .github/workflows/build.yml."
          } > notes.md
          gh release create "$tag" flapus-x86.exe flapus-x64.exe --title "$title" --notes-file notes.md "${flags[@]}"
